<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember · Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-wrapper">

  <!-- Panneau visuel gauche -->
  <div class="auth-visual">
    <div class="logo">Em<span>ber</span></div>
    <p>Gérez vos projets en équipe avec des tableaux Kanban en temps réel.</p>
  </div>

  <!-- Formulaire droit -->
  <div class="auth-form-panel">

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Connexion</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Inscription</button>
    </div>

    <!-- FORMULAIRE LOGIN -->
    <div id="form-login">
      <h1>Bon retour </h1>
      <p class="subtitle">Connecte-toi à ton espace Ember</p>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="ton@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>

      <p class="error-msg" id="login-error"></p>

      <button class="btn-primary" id="btn-login" onclick="handleLogin()">
        Se connecter
      </button>

      <div class="divider">ou</div>

      <button class="btn-google" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continuer avec Google
      </button>
    </div>

    <!-- FORMULAIRE REGISTER -->
    <div id="form-register" style="display:none">
      <h1>Créer un compte</h1>
      <p class="subtitle">Rejoins Ember gratuitement</p>

      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" id="reg-name" placeholder="Ton nom">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="ton@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="reg-password" placeholder="Min. 6 caractères">
      </div>

      <p class="error-msg" id="reg-error"></p>
      <p class="success-msg" id="reg-success"></p>

      <button class="btn-primary" id="btn-register" onclick="handleRegister()">
        Créer mon compte
      </button>

      <div class="divider">ou</div>

      <button class="btn-google" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continuer avec Google
      </button>
    </div>

  </div>
</div>

<script type="module">
  import { login, register, loginWithGoogle, redirectIfLoggedIn } from './js/auth.js'
  import { supabase } from './js/supabase.js'

  // Gère le retour après OAuth Google
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      window.location.href = '/dashboard.html'
    }
  })

  // Redirige si déjà connecté
  redirectIfLoggedIn()

  window.switchTab = (tab) => {
    document.getElementById('form-login').style.display    = tab === 'login'    ? 'block' : 'none'
    document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none'
    document.getElementById('tab-login').classList.toggle('active', tab === 'login')
    document.getElementById('tab-register').classList.toggle('active', tab === 'register')
  }

  window.handleLogin = async () => {
    const email    = document.getElementById('login-email').value.trim()
    const password = document.getElementById('login-password').value
    const errEl    = document.getElementById('login-error')
    const btn      = document.getElementById('btn-login')

    errEl.classList.remove('show')
    btn.disabled = true
    btn.textContent = 'Connexion...'

    try {
      await login(email, password)
      window.location.href = '/dashboard.html'
    } catch (e) {
      errEl.textContent = 'Email ou mot de passe incorrect.'
      errEl.classList.add('show')
    } finally {
      btn.disabled = false
      btn.textContent = 'Se connecter'
    }
  }

  window.handleRegister = async () => {
    const name     = document.getElementById('reg-name').value.trim()
    const email    = document.getElementById('reg-email').value.trim()
    const password = document.getElementById('reg-password').value
    const errEl    = document.getElementById('reg-error')
    const succEl   = document.getElementById('reg-success')
    const btn      = document.getElementById('btn-register')

    errEl.classList.remove('show')
    succEl.classList.remove('show')

    if (password.length < 6) {
      errEl.textContent = 'Le mot de passe doit avoir au moins 6 caractères.'
      errEl.classList.add('show')
      return
    }

    btn.disabled = true
    btn.textContent = 'Création...'

    try {
      await register(name, email, password)
      succEl.textContent = 'Compte créé ! Vérifie ton email pour confirmer.'
      succEl.classList.add('show')
    } catch (e) {
      errEl.textContent = e.message || 'Une erreur est survenue.'
      errEl.classList.add('show')
    } finally {
      btn.disabled = false
      btn.textContent = 'Créer mon compte'
    }
  }

  window.handleGoogle = async () => {
    try { await loginWithGoogle() }
    catch (e) { console.error(e) }
  }
</script>

</body>
</html>
